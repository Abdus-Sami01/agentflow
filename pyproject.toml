[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "0.1.0"
description = "Multi-agent workflow orchestrator with DAG execution, conditional routing, and supervisor pattern"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.scripts]
agentflow = "agentflow.cli:main"

[tool.setuptools.packages.find]
include = ["agentflow*"]
